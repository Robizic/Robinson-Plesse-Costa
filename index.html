<script>
  const menuBtn = document.querySelector('.menu-toggle');
  const mobileMenu = document.querySelector('.mobile-menu');
  const overlay = document.querySelector('.menu-overlay'); // <--- nouvelle ligne

  menuBtn.addEventListener('click', () => {
    const isActive = mobileMenu.classList.toggle('active');
    mobileMenu.setAttribute('aria-hidden', !isActive);
    overlay.classList.toggle('active', isActive); // <--- active le flou
  });

  document.addEventListener('click', (e) => {
    if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target)) {
      if (mobileMenu.classList.contains('active')) {
        mobileMenu.classList.remove('active');
        overlay.classList.remove('active'); // <--- retire le flou
        mobileMenu.setAttribute('aria-hidden', 'true');
      }
    }
  });
</script>
<script>
if (window.innerWidth <= 768) {

    if (imgSrc) {
      slide.innerHTML = `<img src="${imgSrc}" class="mobile-img">`;
    }
  });
}
</script>
